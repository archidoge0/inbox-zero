name: GHAV Inbox Zero 1934 smoke cache

on:
  push:
    branches:
      - 'codex/ghav-inboxzero1934-*'

permissions:
  contents: read

concurrency:
  group: local-bypass-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-bypass-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AUTH_SECRET: secret
      GOOGLE_CLIENT_ID: client_id
      GOOGLE_CLIENT_SECRET: client_secret
      GOOGLE_PUBSUB_TOPIC_NAME: topic
      EMAIL_ENCRYPT_SECRET: secret
      EMAIL_ENCRYPT_SALT: salt
      INTERNAL_API_KEY: secret
      DEFAULT_LLM_PROVIDER: openai
      LOCAL_AUTH_BYPASS_ENABLED: "true"

    steps:
      - name: Checkout repository
        shell: bash
        run: |
          git init .
          git remote add origin https://github.com/elie222/inbox-zero.git
          git fetch --no-tags --depth=1 origin b543b8f0f2f5aa7125cb04f72a99dc2d74951088
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "b543b8f0f2f5aa7125cb04f72a99dc2d74951088"

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Setup Playwright cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-playwright-

      - name: Apply database migrations
        run: pnpm -F inbox-zero-ai exec prisma migrate deploy

      - name: Install Playwright browser
        run: pnpm -F inbox-zero-ai exec playwright install --with-deps chromium

      - name: Run local bypass smoke test
        id: smoke_test
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: pnpm -F inbox-zero-ai test:local-bypass-smoke

      - name: Report PR smoke failure (non-blocking)
        if: ${{ github.event_name == 'pull_request' && steps.smoke_test.outcome == 'failure' }}
        run: |
          echo "::warning::Local bypass smoke test failed (non-blocking on pull requests)."
          echo "::warning::Run this workflow manually (workflow_dispatch) to collect artifacts."

      - name: Upload smoke artifacts
        if: ${{ always() && github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@v4
        with:
          name: local-bypass-smoke-artifacts-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
