name: GHAV Inbox Zero 1934 smoke cache

on:
  push:
    branches:
      - 'codex/ghav-inboxzero1934-*'

permissions:
  contents: read

concurrency:
  group: local-bypass-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  local-bypass-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    env:
      NODE_ENV: development
      NEXT_PUBLIC_BASE_URL: http://localhost:3000
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
      AUTH_SECRET: secret
      GOOGLE_CLIENT_ID: client_id
      GOOGLE_CLIENT_SECRET: client_secret
      GOOGLE_PUBSUB_TOPIC_NAME: topic
      EMAIL_ENCRYPT_SECRET: secret
      EMAIL_ENCRYPT_SALT: salt
      INTERNAL_API_KEY: secret
      DEFAULT_LLM_PROVIDER: openai
      LOCAL_AUTH_BYPASS_ENABLED: "true"

    steps:
      - name: Checkout repository
        shell: bash
        run: |
          git init .
          git remote add origin https://github.com/elie222/inbox-zero.git
          git fetch --no-tags --depth=1 origin b543b8f0f2f5aa7125cb04f72a99dc2d74951088
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "b543b8f0f2f5aa7125cb04f72a99dc2d74951088"

      - name: Synchronize full smoke role selection and navigation
        shell: bash
        run: |
          python3 - <<'PYCODE'
          from pathlib import Path
          from hashlib import sha256
          path = Path('apps/web/__tests__/playwright/local-bypass-smoke.spec.ts')
          source = path.read_text()
          assert sha256(source.encode()).hexdigest() == 'ea0a8b9e89ff62c101bdfbe6d448a224fc89604be15371c5913429109b038416'
          old = '    if (\n      await clickIfVisible(\n        page,\n        page.getByRole("button", { name: /^Founder\\b/ }),\n        1000,\n      )\n    ) {\n      await waitForOnboardingUpdate(page, currentUrl, 10_000);\n      await clickIfVisible(\n        page,\n        page.getByRole("button", { name: /^Continue\\b/ }),\n        5000,\n      );\n      continue;\n    }'
          new = '    const founderButton = page.getByRole("button", { name: /^Founder\\b/ });\n    if (await waitForVisible(founderButton, 1000)) {\n      await expect(founderButton).toBeVisible();\n      const continueButton = page.getByRole("button", {\n        name: /^Continue\\b/,\n      });\n      for (let attempt = 0; attempt < 3; attempt++) {\n        await founderButton.click();\n        try {\n          await expect(continueButton).toBeEnabled({ timeout: 10_000 });\n          break;\n        } catch (error) {\n          const founderClass = await founderButton.getAttribute("class");\n          const roleSelected =\n            founderClass?.includes("border-blue-600") &&\n            founderClass.includes("ring-2");\n          if (roleSelected || attempt === 2) throw error;\n        }\n      }\n      await continueButton.click();\n      await waitForOnboardingUpdate(page, currentUrl, 60_000);\n      continue;\n    }'
          assert source.count(old) == 1
          revised = source.replace(old, new)
          assert sha256(revised.encode()).hexdigest() == '5ea0cf1c49d0ee23f40d3fb300d2354fc9c2fd07dc13f2f02abf7c08feb15c2d'
          path.write_text(revised)
          print('GHAV_SMOKE_TEST_SHA256=5ea0cf1c49d0ee23f40d3fb300d2354fc9c2fd07dc13f2f02abf7c08feb15c2d')
          PYCODE

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24.21.0"
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"

      - name: Apply database migrations
        run: pnpm -F inbox-zero-ai exec prisma migrate deploy

      - name: Install Playwright browser
        run: pnpm -F inbox-zero-ai exec playwright install --with-deps chromium

      - name: Run local bypass smoke test
        id: smoke_test
        continue-on-error: ${{ github.event_name == 'pull_request' }}
        run: pnpm -F inbox-zero-ai test:local-bypass-smoke

      - name: Report PR smoke failure (non-blocking)
        if: ${{ github.event_name == 'pull_request' && steps.smoke_test.outcome == 'failure' }}
        run: |
          echo "::warning::Local bypass smoke test failed (non-blocking on pull requests)."
          echo "::warning::Run this workflow manually (workflow_dispatch) to collect artifacts."

      - name: Upload smoke artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: local-bypass-smoke-artifacts-${{ github.run_id }}
          path: |
            apps/web/playwright-report
            apps/web/test-results
          retention-days: 7
