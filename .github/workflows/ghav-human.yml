name: "ghav human: Playwright"
"on":
  push:
    branches:
      - ghav/dev/3662
    paths:
      - .ghav/human
permissions:
  contents: read
env:
  PLAYWRIGHT_SKIP_REPORT_MERGE: "1"
  NODE_ENV: development
  NODE_OPTIONS: --max_old_space_size=6144
  NEXT_PUBLIC_BASE_URL: http://localhost:3000
  DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
  AUTH_SECRET: secret
  GOOGLE_CLIENT_ID: client_id
  GOOGLE_CLIENT_SECRET: client_secret
  GOOGLE_BASE_URL: http://localhost:4100
  GOOGLE_PUBSUB_TOPIC_NAME: topic
  EMAIL_ENCRYPT_SECRET: secret
  EMAIL_ENCRYPT_SALT: salt
  INTERNAL_API_KEY: secret
  DEFAULT_LLMS: openai:gpt-5.4-mini
  UPSTASH_REDIS_URL: http://localhost:8079
  UPSTASH_REDIS_TOKEN: playwright-token
  PLAYWRIGHT_PRODUCTION: "1"
  NEXT_PUBLIC_EMAIL_SEND_ENABLED: "true"
  NEXT_PUBLIC_MEETING_RECORDER_ENABLED: "true"
  NEXT_PUBLIC_CONTACTS_ENABLED: "true"
  NEXT_PUBLIC_INTEGRATIONS_ENABLED: "true"
  NEXT_PUBLIC_INTEGRATION_ACTION_ENABLED: "true"
  NEXT_PUBLIC_EXTERNAL_API_ENABLED: "true"
jobs:
  select:
    name: Select specs and build browser app
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      batches: ${{ steps.targets.outputs.batches }}
      changed_tests: ${{ steps.changes.outputs.PLAYWRIGHT_CHANGED_TEST_FILES }}
    steps:
      - uses: actions/checkout@v4
      - name: Find changed files
        id: changes
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
        run: |
          set -euo pipefail

          changed_files_path="$RUNNER_TEMP/changed-files.txt"
          changed_test_files_path="$RUNNER_TEMP/changed-playwright-files.txt"
          : > "$changed_files_path"
          : > "$changed_test_files_path"

          if [[ "$GITHUB_EVENT_NAME" == "pull_request" ]] &&
            [[ -n "$BASE_SHA" ]] &&
            [[ "$BASE_SHA" != "0000000000000000000000000000000000000000" ]]; then
            git fetch --no-tags --depth=1 origin "$BASE_SHA"
            git diff --name-only --diff-filter=ACMRD "$BASE_SHA" "$GITHUB_SHA" \
              > "$changed_files_path"
            grep '^apps/web/__tests__/playwright/' "$changed_files_path" | \
              sed 's#^apps/web/##' > "$changed_test_files_path" || true
          fi

          delimiter="PLAYWRIGHT_FILES_$(openssl rand -hex 16)"
          {
            echo "PLAYWRIGHT_CHANGED_FILES<<$delimiter"
            cat "$changed_files_path"
            echo "$delimiter"
            echo "PLAYWRIGHT_CHANGED_TEST_FILES<<$delimiter"
            cat "$changed_test_files_path"
            echo "$delimiter"
          } | tee -a "$GITHUB_ENV" >> "$GITHUB_OUTPUT"
      - name: Remove checkout credentials
        run: git config --local --unset-all "http.${GITHUB_SERVER_URL}/.extraheader"
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: bash scripts/pnpm-install-without-desktop.sh --frozen-lockfile
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: "1"
      - name: Select isolated spec batches
        id: targets
        working-directory: apps/web
        run: |
          batches="$(node __tests__/playwright/run-emulated-suite.mjs --list-batches)"
          echo "batches=$batches" >> "$GITHUB_OUTPUT"
      - name: Build browser app once
        if: steps.targets.outputs.batches != '[]'
        run: pnpm -F inbox-zero-ai build:ci
        env:
          NODE_ENV: production
          NODE_OPTIONS: --max_old_space_size=16384
          SKIP_TYPE_CHECK: "true"
      - name: Package browser app
        if: steps.targets.outputs.batches != '[]'
        working-directory: apps/web
        run: tar --exclude='.next/cache' -cf "$RUNNER_TEMP/playwright-app.tar" .next public/sw*
      - name: Upload browser app
        if: steps.targets.outputs.batches != '[]'
        uses: actions/upload-artifact@v4
        with:
          name: playwright-app-${{ github.run_id }}
          path: ${{ runner.temp }}/playwright-app.tar
          compression-level: 1
          retention-days: 1
          overwrite: true
          if-no-files-found: error
